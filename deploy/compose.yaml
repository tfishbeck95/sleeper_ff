# A production-like stack on one machine: PostgreSQL, the migration job, the API, the worker, and the
# dashboard behind a static server.
#
#   cd deploy && cp .env.example .env && $EDITOR .env
#   docker compose up --build
#
# It is the deployment topology rather than a convenient approximation of it, because the things worth
# rehearsing locally are exactly the ones a single all-in-one process hides: that migrations run to
# completion before any application process starts, that one worker owns the schedule and the API
# instances are told they do not, that the forecast credential reaches the worker and nothing else, and
# that stopping the stack drains rather than kills.
#
# **The API and worker will refuse to start against PostgreSQL until the adapter exists.** The schema
# in `apps/api/migrations` is real and this stack applies it, but `createRepository` has no PostgreSQL
# implementation behind it yet and says so at startup rather than failing on the first query in front of
# a user. Until it lands, `docker compose --profile single up single` runs the supported single-instance
# profile — one combined process on the JSON adapter with a persistent volume — and the services below
# are the shape the deployment takes the moment the adapter is in. See docs/storage.md.
#
# Every variable is assigned to a service explicitly rather than through a shared env_file, so this file
# is also the answer to which component holds which secret. The API is not given the forecast key. The
# worker is not given a web origin. Neither is given anything that can alter the schema.

name: huddle

services:
  # --- PostgreSQL -------------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-huddle}
      # Consumed here to create the role, and by the migration job and the application through
      # DATABASE_URL. It is the only copy: nothing else in this file re-states it.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}"
      POSTGRES_DB: ${POSTGRES_DB:-huddle}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Not published by default. Nothing outside this stack needs to reach the database, and a database
    # on a laptop's network interface is a database on whatever network that laptop joins next.
    expose: ["5432"]
    healthcheck:
      # `pg_isready` alone answers true while the server is still starting up for the first time, so it
      # is pointed at the actual database the migration job is about to connect to.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-huddle} -d ${POSTGRES_DB:-huddle}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # --- Migrations -------------------------------------------------------------------------------
  # A job, not a service: it applies what the ledger says is pending and exits. Everything that needs
  # the schema waits for it to exit 0, which is the ordering a real deployment has to have and the one
  # that is easiest to get wrong.
  migrate:
    build:
      context: ..
      dockerfile: deploy/migrate.Dockerfile
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-huddle}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-huddle}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # --- API --------------------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    command: ["node", "dist/api.js"]
    environment:
      NODE_ENV: production
      PORT: "4000"
      # Exact origins allowed to send credentialed requests. Comma-separated for a cutover between two.
      WEB_ORIGIN: ${WEB_ORIGIN:-https://localhost:8443}
      STORAGE_ADAPTER: postgres
      DATABASE_URL: "postgres://${POSTGRES_USER:-huddle}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-huddle}"
      APP_INSTANCE_MODE: multi
      # The separation, stated. This instance does not own the schedule; the worker does.
      SYNC_WORKER_ENABLED: "false"
      APP_LOGIN_USER: ${APP_LOGIN_USER:-admin}
      APP_LOGIN_PASSWORD_HASH: "${APP_LOGIN_PASSWORD_HASH:?generate one with npm run password-hash -w @sleeper/api}"
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-120}
      # One proxy in front: the static server, or whatever terminates TLS in a real deployment. Without
      # it every request looks like it came from that proxy and the rate limits share one bucket.
      TRUST_PROXY: "1"
      # Metrics and probes on their own port, deliberately not published below: a scrape describes
      # the deployment — route names, traffic, error rates — and belongs on an internal network.
      METRICS_PORT: "4001"
      # The read side of the forecast feed. No credential: this process never calls the source, it reads
      # what the worker retained.
      PROJECTION_FEED_ENABLED: ${PROJECTION_FEED_ENABLED:-false}
      PROJECTION_FEED_PATH: /var/lib/huddle/projection-feed.json
      SHUTDOWN_GRACE_SECONDS: "20"
    volumes:
      # Read-only: the worker writes the feed, the API only reads it.
      - forecast-data:/var/lib/huddle:ro
    ports: ["${API_PORT:-4000}:4000"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # PID 1 in a container has no default signal handlers, and an init also reaps anything the process
    # leaves behind. The application installs its own SIGTERM handler either way.
    init: true
    # Longer than SHUTDOWN_GRACE_SECONDS, so the process gets to finish its own drain rather than being
    # killed part-way through one. Docker's default is 10s, which is shorter than the grace period.
    stop_grace_period: 30s
    restart: unless-stopped

  # --- Worker -----------------------------------------------------------------------------------
  # One of these. It owns every scheduled call to Sleeper, the player directory refresh, session expiry
  # and forecast ingestion, and it is the only process given the forecast credential.
  worker:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      STORAGE_ADAPTER: postgres
      DATABASE_URL: "postgres://${POSTGRES_USER:-huddle}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-huddle}"
      APP_INSTANCE_MODE: multi
      SYNC_WORKER_ENABLED: "true"
      # Names the lease holder, so the logs and the lease table say "worker" rather than a container id
      # that changes on every deploy.
      SYNC_WORKER_ID: huddle-worker
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-30}
      SYNC_CONCURRENCY: ${SYNC_CONCURRENCY:-3}
      # The worker serves no application traffic, so this is the only thing an orchestrator can ask
      # it: /health/live, /health/ready and /metrics, on an unpublished port.
      WORKER_HEALTH_PORT: "4010"
      PROJECTION_FEED_ENABLED: ${PROJECTION_FEED_ENABLED:-false}
      # The licensed forecast credential, in the one component that calls the source.
      SPORTSDATAIO_API_KEY: ${SPORTSDATAIO_API_KEY:-}
      PROJECTION_FEED_PATH: /var/lib/huddle/projection-feed.json
      PROJECTION_FEED_TIME_ZONE: ${PROJECTION_FEED_TIME_ZONE:-America/New_York}
      SHUTDOWN_GRACE_SECONDS: "20"
    volumes:
      # Writable here: this is the process that ingests.
      - forecast-data:/var/lib/huddle
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Liveness: this check replaces the container, so it must not fail on a database blip or
      # during a drain. `/health/ready` is the one a load balancer would ask.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4010/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    init: true
    # Longer than the API's: a sweep in flight is finished rather than abandoned part-way through
    # replacing a league's authoritative rows.
    stop_grace_period: 45s
    restart: unless-stopped

  # --- Dashboard --------------------------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        # Substituted into the bundle at build time, so this image serves exactly one environment.
        # Nothing secret: anything built into a bundle is readable by anyone who loads the page.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    environment:
      # What the page's connect-src is allowed to reach, which is the API's origin when it is hosted
      # separately from the dashboard.
      API_ORIGIN: ${API_ORIGIN:-http://localhost:4000}
    ports: ["${WEB_PORT:-8080}:8080"]
    depends_on: [api]
    init: true
    restart: unless-stopped

  # --- The supported single-instance profile ----------------------------------------------------
  # One process, the JSON adapter, one volume. This is what runs today, and what an installation with a
  # single instance should run in production: there is nothing to coordinate, so there is no reason to
  # run two processes or a database. Start it by naming the service, so the PostgreSQL-backed services
  # above — which publish the same port — are not started alongside it:
  #
  #   docker compose --profile single up single
  single:
    profiles: ["single"]
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    command: ["node", "dist/index.js"]
    environment:
      NODE_ENV: production
      PORT: "4000"
      WEB_ORIGIN: ${WEB_ORIGIN:-https://localhost:8443}
      STORAGE_ADAPTER: json
      # Named, not inferred. The JSON adapter is refused for a multi-instance production deployment,
      # because a file is atomic within one process and no further.
      APP_INSTANCE_MODE: single
      DATA_FILE: /var/lib/huddle/store.json
      SYNC_WORKER_ENABLED: "true"
      APP_LOGIN_USER: ${APP_LOGIN_USER:-admin}
      APP_LOGIN_PASSWORD_HASH: "${APP_LOGIN_PASSWORD_HASH:?generate one with npm run password-hash -w @sleeper/api}"
      TRUST_PROXY: "1"
      # Not published below: a scrape describes the deployment and belongs on an internal network.
      METRICS_PORT: "4001"
      PROJECTION_FEED_ENABLED: ${PROJECTION_FEED_ENABLED:-false}
      SPORTSDATAIO_API_KEY: ${SPORTSDATAIO_API_KEY:-}
      PROJECTION_FEED_PATH: /var/lib/huddle/projection-feed.json
      SHUTDOWN_GRACE_SECONDS: "20"
    volumes:
      - single-data:/var/lib/huddle
    ports: ["${API_PORT:-4000}:4000"]
    init: true
    stop_grace_period: 45s
    restart: unless-stopped

volumes:
  postgres-data:
  # The retained forecast feed: written by the worker, read by the API. It is licensed source data, so
  # it lives on a volume rather than in an image — an image is redistribution.
  forecast-data:
  single-data:
